# Continuous integration: runs the same release verification as `ship` / checkpoint / deliver
# (npm ci, pip, all Node tests, Python worker tests, test_local_delivery.py, Playwright release suite).
# Production delivery stays local: tools\deploy\ship.ps1 on the PC that hosts port 3100.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Release verification (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify (same suite as local release)
        # The runner's default TEMP uses an 8.3 short name (RUNNER~1); path-ownership tests need the long form.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: python tools/deploy/ci_verify.py
      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-log
          path: var/maintenance/delivery/ci-*.log
          if-no-files-found: ignore
          retention-days: 14
