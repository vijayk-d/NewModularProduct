# JobApp link-click tracker (Cloudflare Workers, free tier). Deploy steps: docs/link-click-tracking.md
# Secrets are never written here: SIGNING_KEY, READ_KEY and PROFILE_URL are set with `wrangler secret put`.
name = "jobapp-links"
main = "src/worker.js"
compatibility_date = "2026-11-01"
workers_dev = true
# Only the one public address; no per-version preview addresses.
preview_urls = false

[[kv_namespaces]]
binding = "CLICKS"
# Store id from: npx wrangler kv namespace create CLICKS (not a secret)
id = "a5b31734b3c2416cb468dea37b66aeab"
