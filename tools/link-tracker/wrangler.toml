# JobApp link-click tracker (Cloudflare Workers, free tier). Deploy steps: docs/link-click-tracking.md
# Secrets are never written here: SIGNING_KEY, READ_KEY and PROFILE_URL are set with `wrangler secret put`.
name = "jobapp-links"
main = "src/worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

[[kv_namespaces]]
binding = "CLICKS"
# Replace with the id printed by: npx wrangler kv namespace create CLICKS
id = "REPLACE_WITH_KV_NAMESPACE_ID"
