<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CV Library</title>
<style>
:root{--ink:#172033;--muted:#526474;--line:#d8e0ea;--card:#fff;--bg:#f5f7fb;--accent:#1d4ed8}
body{font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink);margin:0}
main{max-width:1200px;margin:auto;padding:24px}
h1{margin:0 0 .25rem}
button,input,textarea,select{font:inherit}
button{cursor:pointer;padding:.45rem .8rem;border:1px solid #94a3b8;border-radius:.45rem;background:#fff;color:var(--ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{cursor:wait;opacity:.6}
#notice{background:#fff7e0;border:1px solid #f5d77a;border-radius:.5rem;padding:.7rem 1rem;margin:.75rem 0}
.toolbar{display:flex;flex-wrap:wrap;gap:1rem;align-items:flex-end;margin:1rem 0}
.group{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;padding:.35rem .5rem;border:1px solid var(--line);border-radius:.55rem;background:#fff}
.group::before{content:attr(aria-label);font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-right:.25rem}
.filters{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin:.5rem 0 1rem}
.filters input{padding:.45rem .6rem;border:1px solid #94a3b8;border-radius:.45rem;min-width:min(100%,18rem)}
.filters select{padding:.45rem;border:1px solid #94a3b8;border-radius:.45rem}
#summary{color:var(--muted)}
#status{min-height:1.5em;color:#334155}
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:1rem}
.cv-card{background:var(--card);border:1px solid var(--line);border-radius:.7rem;padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.5rem;box-shadow:0 1px 3px #0000000d}
.cv-card header{display:flex;justify-content:space-between;gap:.5rem;align-items:flex-start}
.cv-card h2{font-size:1.05rem;margin:0}
.cv-card .role{color:var(--muted);font-size:.92rem;margin:0}
.chip{display:inline-block;border-radius:999px;padding:.05rem .65rem;font-size:.8rem;font-weight:600;white-space:nowrap}
.chip-indexed{background:#dcfce7;color:#166534}.chip-changed{background:#fef3c7;color:#92400e}.chip-failed,.chip-unavailable{background:#fee2e2;color:#991b1b}.chip-not-indexed{background:#e2e8f0;color:#334155}
dl{display:grid;grid-template-columns:7.5rem 1fr;gap:.2rem .6rem;margin:0;font-size:.9rem}
dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}
.terms{display:flex;flex-wrap:wrap;gap:.3rem}
.terms span{background:#eef2ff;color:#3730a3;border-radius:.35rem;padding:0 .4rem;font-size:.8rem}
.cv-card .actions{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:auto}
.priority{font-size:.78rem;color:var(--muted)}
details.report{margin-top:1.5rem;background:#fff;border:1px solid var(--line);border-radius:.6rem;padding:.6rem 1rem}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f5f7;padding:15px;max-height:500px;overflow:auto}
dialog{width:min(760px,92%);border:1px solid var(--line);border-radius:.7rem}
dialog label{display:block;margin:.6rem 0 .2rem;font-weight:600}
dialog input,dialog textarea,dialog select{width:100%;box-sizing:border-box;padding:.45rem;border:1px solid #94a3b8;border-radius:.4rem}
dialog textarea{height:70px}
.empty{color:var(--muted);padding:1rem}
</style><script type="module" src="/cv-library-v1.js"></script></head><body><main>
<h1>CV Library</h1>
<p id="summary" data-library-summary>Loading…</p>
<p id="notice">Loading CV-library configuration. Original documents are never overwritten.</p>
<div class="toolbar">
 <div class="group" role="group" aria-label="Library"><button id="add" class="primary">Add CV</button><button id="discover">Find unregistered files</button><a href="/api/cv-library/export" download>Export catalogue</a></div>
 <div class="group" role="group" aria-label="Indexing"><button id="changed">Index changed CVs</button><button id="all">Re-index all</button></div>
 <div class="group" role="group" aria-label="Check"><button id="validate">Check files</button><button id="reload">Refresh</button></div>
</div>
<div class="filters"><label for="search">Search</label><input id="search" type="search" placeholder="Code, role, tag or term"><label for="state-filter">Show</label><select id="state-filter"><option value="">All CVs</option><option value="indexed">Indexed</option><option value="attention">Needs attention</option></select></div>
<p id="status" role="status" aria-live="polite"></p>
<div id="cards" aria-live="polite"></div>
<details class="report"><summary>Report and document inspection</summary><pre id="report"></pre></details>
<dialog id="editor"><form id="form"><h2 id="edit-title">CV entry</h2><label for="code">Stable code</label><input id="code" required maxlength="60" pattern="[A-Za-z0-9][A-Za-z0-9_-]*"><label for="name">Role name</label><input id="name" required maxlength="160"><label for="path">PDF/DOCX path relative to CV_FOLDER</label><input id="path" required><label for="tags">Tags — one per line</label><textarea id="tags"></textarea><label for="cases">Use cases — one per line</label><textarea id="cases"></textarea><label for="priority">Priority</label><select id="priority"><option>very-high</option><option>high</option><option selected>medium</option><option>low</option></select><p>Existing codes cannot be renamed or deleted. Catalogue edits do not rerank existing applications.</p><p id="edit-error" role="alert"></p><button type="submit" class="primary">Review and save</button> <button type="button" id="cancel">Cancel</button></form></dialog>
</main></body></html>
